<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UIGS Tool Canvas Reference</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}
.shell{padding:16px}.catalog{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);background:Canvas}
.canvas{position:relative;height:70dvh;min-height:420px;overflow:hidden;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:16px;background:color-mix(in srgb,Canvas 95%,CanvasText 5%)}
.tool{position:absolute;width:250px;height:160px;border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:14px;background:Canvas;box-shadow:0 10px 30px color-mix(in srgb,CanvasText 12%,transparent);padding:10px;user-select:none}
.tool.transient{outline:3px dashed color-mix(in srgb,CanvasText 35%,transparent)}.handle{cursor:grab;font-weight:700;padding-bottom:8px}.meta{font:12px ui-monospace,monospace;opacity:.7;white-space:pre-line}
.actions{display:flex;gap:6px;position:absolute;bottom:10px;left:10px}
</style></head><body><main class="shell"><h1>Capability Catalog + Surface Geometry</h1><div class="catalog">
<button data-tool="font">Spawn Font Tool</button><button data-tool="position">Spawn Position Tool</button><button data-tool="effects">Spawn Effects Tool</button></div>
<div class="canvas" id="canvas"></div></main><script>
const canvas=document.querySelector('#canvas');let seq=0;const catalog={font:'Font',position:'Position',effects:'Effects'};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>spawn(b.dataset.tool));
function spawn(key){const id=++seq,el=document.createElement('section');let committed={x:28+id*24,y:28+id*20};let candidate={...committed};
el.className='tool';el.innerHTML='<div class="handle">'+catalog[key]+' Tool #'+id+'</div><div class="meta"></div><div class="actions"><button class="commit">Commit</button><button class="cancel">Cancel</button></div>';
canvas.append(el);const meta=el.querySelector('.meta');const paint=()=>{const maxX=Math.max(0,canvas.clientWidth-el.offsetWidth),maxY=Math.max(0,canvas.clientHeight-el.offsetHeight);const px=Math.min(Math.max(candidate.x,0),maxX),py=Math.min(Math.max(candidate.y,0),maxY);el.style.transform='translate('+px+'px,'+py+'px)';meta.textContent='toolKey='+key+'\ncommitted=('+committed.x+','+committed.y+')\ncandidate=('+candidate.x+','+candidate.y+')\nprojected=('+px+','+py+')'};paint();
let drag=null;el.querySelector('.handle').onpointerdown=e=>{drag={sx:e.clientX,sy:e.clientY,bx:candidate.x,by:candidate.y};el.classList.add('transient');e.target.setPointerCapture(e.pointerId)};
el.querySelector('.handle').onpointermove=e=>{if(!drag)return;candidate={x:drag.bx+e.clientX-drag.sx,y:drag.by+e.clientY-drag.sy};paint()};
el.querySelector('.handle').onpointerup=()=>{drag=null};el.querySelector('.commit').onclick=()=>{committed={...candidate};el.classList.remove('transient');paint()};el.querySelector('.cancel').onclick=()=>{candidate={...committed};el.classList.remove('transient');paint()};
new ResizeObserver(paint).observe(canvas)}
</script></body></html>
