name: Owner Atlas historical replay (opt-in)

# Template only. Do not install without explicit owner authorization.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: foundry
      - uses: actions/checkout@v4
        with:
          repository: 11576865/HSR-Voice-Archive-Builder
          ref: dea5411312ed3e819864f1915f4f2008f938cba3
          fetch-depth: 0
          persist-credentials: false
          path: hsr
      - name: Check isolated candidate-review logic
        run: python -m unittest discover -s foundry/tools/owner_atlas -p 'test_*.py' -q
      - name: Verify PR194 before/after Git object anchors
        run: |
          python foundry/tools/owner_atlas/pilot_cli.py \
            --repo-root "$GITHUB_WORKSPACE/hsr" \
            --fixture "$GITHUB_WORKSPACE/foundry/fixtures/hsr-pr194" \
            --out "$RUNNER_TEMP/owner-atlas-pr194"
      - name: Upload unsigned candidate evidence (not acceptance)
        uses: actions/upload-artifact@v4
        with:
          name: owner-atlas-pr194-source-candidate
          path: ${{ runner.temp }}/owner-atlas-pr194/
          retention-days: 14
