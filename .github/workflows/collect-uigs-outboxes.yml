name: Collect UIGS Outboxes

on:
  push:
    branches: [main]
    paths:
      - 'outbox/sources.json'
      - 'tools/collect_outboxes.py'
      - 'tools/test_collect_outboxes.py'
      - '.github/workflows/collect-uigs-outboxes.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uigs-outbox-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test collector logic
        run: python tools/test_collect_outboxes.py

      - name: Collect durable source outboxes
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/collect_outboxes.py

      - name: Test and triage newly collected Pending
        run: |
          python tools/test_triage_pending.py
          python tools/triage_pending.py
          python tools/generate_red_reason_report.py

      - name: Generate reviewable proposals in the same run
        run: |
          python tools/test_propose_promotions.py
          python tools/propose_promotions.py
          python tools/generate_promotion_report.py

      - name: Validate Foundry after intake pipeline
        run: python tools/validate_foundry.py

      - name: Report generator smoke
        run: python tools/generate_reports.py

      - name: Commit intake pipeline outputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- outbox reports/outbox-status.md reports/red-reason-status.md reports/promotion-status.md)" ]]; then
            echo "No new intake pipeline outputs."
            exit 0
          fi
          git config user.name "uigs-foundry-bot"
          git config user.email "uigs-foundry-bot@users.noreply.github.com"
          git add -A outbox reports/outbox-status.md reports/red-reason-status.md reports/promotion-status.md
          git commit -m "chore(intake): collect, triage, and propose durable intake"
          bash tools/push_with_rebase_retry.sh main 5

      - name: Surface collector failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::One or more UIGS outbox sources could not be collected."
          exit 1
