name: Collect UIGS Outboxes

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uigs-outbox-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test collector logic
        run: python tools/test_collect_outboxes.py

      - name: Collect durable source outboxes
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/collect_outboxes.py

      - name: Validate Foundry after intake
        run: python tools/validate_foundry.py

      - name: Report generator smoke
        run: python tools/generate_reports.py

      - name: Commit imported pending packets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- outbox reports/outbox-status.md; then
            echo "No new outbox packets."
            exit 0
          fi
          git config user.name "uigs-foundry-bot"
          git config user.email "uigs-foundry-bot@users.noreply.github.com"
          git add -A outbox reports/outbox-status.md
          git commit -m "chore(intake): collect durable project outboxes"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Surface collector failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::One or more UIGS outbox sources could not be collected."
          exit 1
