name: Code Atlas Source Observation

on:
  push:
    paths:
      - "tools/code_atlas.py"
      - "tools/code_atlas_trace.py"
      - "tools/code_atlas_causality.py"
      - "tools/code_atlas_causality_demo.py"
      - "tools/test_code_atlas_causality.py"
      - "tools/test_code_atlas_trace.py"
      - "tools/code_atlas_web/**"
      - "tools/test_code_atlas_browser.py"
      - "tools/test_code_atlas.py"
      - "tools/check_code_atlas_accuracy.py"
      - "docs/code-atlas.md"
      - ".github/workflows/code-atlas-check.yml"
      - "tools/code_atlas_file_demo.py"
      - "tools/test_code_atlas_file_evidence.py"
  pull_request:
    paths:
      - "tools/code_atlas.py"
      - "tools/code_atlas_trace.py"
      - "tools/test_code_atlas_trace.py"
      - "tools/code_atlas_web/**"
      - "tools/test_code_atlas_browser.py"
      - "tools/test_code_atlas.py"
      - "tools/check_code_atlas_accuracy.py"
      - "docs/code-atlas.md"
      - ".github/workflows/code-atlas-check.yml"
      - "tools/code_atlas_causality.py"
      - "tools/code_atlas_causality_demo.py"
      - "tools/test_code_atlas_causality.py"
      - "tools/code_atlas_file_demo.py"
      - "tools/test_code_atlas_file_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-graph-and-self-observation:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run source-grounding and self-observation tests
        run: python -m unittest discover -s tools -p test_code_atlas.py -v
      - name: Run opt-in Python runtime collector tests
        run: python -m unittest discover -s tools -p test_code_atlas_trace.py -v
      - name: Test explicit operation annotation and correlation
        run: python -m unittest discover -s tools -p test_code_atlas_causality.py -v
      - name: Test bounded selected-file change observations
        run: python -m unittest discover -s tools -p test_code_atlas_file_evidence.py -v
      - name: Check bounded source-reference accuracy
        run: python tools/check_code_atlas_accuracy.py --output /tmp/code-atlas-accuracy.json
      - name: Upload accuracy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uigs-code-atlas-accuracy
          path: /tmp/code-atlas-accuracy.json
          retention-days: 14
      - name: Build read-only source graph
        run: python tools/code_atlas.py --output /tmp/uigs-code-atlas.json
      - name: Collect real runtime evidence from safe UIGS test entrypoint
        run: |
          python tools/code_atlas_trace.py --root . --repo 11576865/UIGS-Foundry --script tools/test_epistemic_graph.py --output /tmp/uigs-code-atlas-runtime.json
          python tools/code_atlas.py --runtime-trace /tmp/uigs-code-atlas-runtime.json --output /tmp/uigs-code-atlas-observed.json
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path("/tmp/uigs-code-atlas-observed.json").read_text())
          assert g["runtime_trace"]["anchored"], "runtime observation must be commit-pinned"
          assert g["stats"]["runtime_edges"] > 0, "no in-repository runtime edges resolved"
          assert any(e["from"] == "fn:tools/test_epistemic_graph.py:test_same_lineage_counts_once"
                     and e["to"] == "fn:tools/evaluate_epistemic_graph.py:evaluate"
                     and e["evidence"] == "python_profile_observed" for e in g["edges"])
          print("Real source-matched runtime evidence:", g["runtime_trace"])
          PY
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: uigs-code-atlas-runtime
          path: |
            /tmp/uigs-code-atlas-runtime.json
            /tmp/uigs-code-atlas-observed.json
          retention-days: 14
      - name: Observe an explicitly annotated safe operation
        run: |
          python tools/code_atlas_trace.py --root . --repo 11576865/UIGS-Foundry --script tools/code_atlas_causality_demo.py --output /tmp/uigs-atlas-operations.json
          python tools/code_atlas.py --runtime-trace /tmp/uigs-atlas-operations.json --output /tmp/uigs-atlas-operations-graph.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/uigs-atlas-operations-graph.json").read_text())
          ops = data["operation_evidence"]
          events = ops["annotations"]["events"]
          calls = ops["calls"]
          assert data["runtime_trace"]["anchored"], "operation evidence must match HEAD"
          assert [e["kind"] for e in events] == ["operation_begin", "action", "state_delta", "checkpoint", "operation_end"]
          assert events[2]["detail"]["verdict"] == "changed"
          assert events[2]["detail"]["method"] == "json_before_after"
          assert any(c["from"] == "fn:tools/code_atlas_causality_demo.py:calculate"
                     and c["to"] == "fn:tools/code_atlas_causality_demo.py:compute_value"
                     and c["count"] == 1 for c in calls)
          assert not ops["unmatched_calls"]
          assert not ops["annotations"]["truncated"]
          print("Explicit operation events linked to observed real calls:", len(calls))
          PY
      - name: Upload correlated operation evidence
        uses: actions/upload-artifact@v4
        with:
          name: uigs-code-atlas-operation-evidence
          path: |
            /tmp/uigs-atlas-operations.json
            /tmp/uigs-atlas-operations-graph.json
          retention-days: 14
      - name: Observe real temporary file creation with explicit opt-in
        run: |
          python tools/code_atlas_trace.py --root . --repo 11576865/UIGS-Foundry --script tools/code_atlas_file_demo.py --output /tmp/uigs-atlas-file-operations.json
          python tools/code_atlas.py --runtime-trace /tmp/uigs-atlas-file-operations.json --output /tmp/uigs-atlas-file-graph.json
          python tools/code_atlas.py --runtime-trace /tmp/uigs-atlas-file-operations.json --export-html /tmp/UIGS_Code_Atlas_File_Observation.html
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path("/tmp/uigs-atlas-file-graph.json").read_text())
          obs=graph["operation_evidence"]
          observed=obs["annotations"]["events"]
          deltas=[e for e in observed if e["kind"]=="file_delta"]
          assert graph["runtime_trace"]["anchored"], "file evidence must match HEAD"
          assert len(deltas)==1, observed
          assert deltas[0]["subject"]=="demo:artifact"
          assert deltas[0]["detail"]["verdict"]=="created"
          assert deltas[0]["detail"]["method"]=="bounded_sha256_before_after"
          assert not obs["annotations"]["truncated"]
          assert any(c["from"]=="fn:tools/code_atlas_file_demo.py:run_demo"
                     and c["to"]=="fn:tools/code_atlas_file_demo.py:make_artifact"
                     for c in obs["calls"]), "file effect not linked to real Python call"
          assert not obs["unmatched_calls"]
          print("File change evidence with real call correlation:", len(obs["calls"]))
          PY
      - name: Upload file-change evidence
        uses: actions/upload-artifact@v4
        with:
          name: uigs-code-atlas-file-effects
          path: |
            /tmp/uigs-atlas-file-operations.json
            /tmp/uigs-atlas-file-graph.json
            /tmp/UIGS_Code_Atlas_File_Observation.html
          retention-days: 14
      - name: Export shareable standalone browser artifact
        run: python tools/code_atlas.py --runtime-trace /tmp/uigs-atlas-operations.json --export-html /tmp/UIGS_Code_Atlas.html
      - name: Upload browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: uigs-code-atlas-browser
          path: /tmp/UIGS_Code_Atlas.html
          retention-days: 14
      - name: Verify serializable graph contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/uigs-code-atlas.json").read_text())
          assert p["schema_version"] == 1
          assert p["stats"]["parsed_files"] > 1
          assert any(n["id"] == "fn:tools/code_atlas.py:index" for n in p["nodes"])
          assert len(p["nodes"]) == len({n["id"] for n in p["nodes"]})
          assert all(e["evidence"] in {"ast_definition","ast_import","ast_direct_call"} for e in p["edges"])
          print("Code Atlas graph contract verified:", p["stats"])
          PY

  real-chromium-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UIGS_ATLAS_BROWSER_ARTIFACT_DIR: /tmp/uigs-atlas-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless Chromium and Playwright
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Verify source and operation evidence in Chromium
        run: python -m unittest discover -s tools -p test_code_atlas_browser.py -v
      - name: Upload Chromium viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uigs-code-atlas-browser-e2e
          path: /tmp/uigs-atlas-browser/
          if-no-files-found: ignore
          retention-days: 14
