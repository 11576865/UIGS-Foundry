name: Capture UI Reference Baselines

on:
  push:
    branches: [main]
    paths:
      - 'domains/interface-grammar/showcases/reference-demos/**'
      - 'domains/interface-grammar/showcases/baseline-targets.json'
      - 'tools/capture_reference_baselines.py'
      - '.github/workflows/capture-ui-reference-baselines.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uigs-reference-baselines
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture declared baselines with hosted Chrome
        run: python tools/capture_reference_baselines.py

      - name: Validate showcase manifests and hashes
        run: python tools/test_ui_showcases.py

      - name: Persist baseline source evidence first
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- domains/interface-grammar/showcases/baselines domains/interface-grammar/showcases/manifests)" ]]; then
            git config user.name "uigs-foundry-bot"
            git config user.email "uigs-foundry-bot@users.noreply.github.com"
            git add -A domains/interface-grammar/showcases/baselines domains/interface-grammar/showcases/manifests
            git commit -m "chore(uigs): refresh reference visual baselines"
            bash tools/push_with_rebase_retry.sh main 5
          else
            echo "Baseline source evidence unchanged."
            git fetch origin main
            git rebase origin/main
          fi

      - name: Rebuild dependent search/coverage from latest source state
        run: |
          python tools/build_ui_search_index.py
          python tools/test_ui_pattern_query.py
          python tools/test_ui_composition.py
          python tools/test_ui_showcases.py

      - name: Persist derived UI indexes separately
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- domains/interface-grammar/search/index.json domains/interface-grammar/showcases/coverage.json)" ]]; then
            echo "Derived UI indexes unchanged."
            exit 0
          fi
          git config user.name "uigs-foundry-bot"
          git config user.email "uigs-foundry-bot@users.noreply.github.com"
          git add domains/interface-grammar/search/index.json domains/interface-grammar/showcases/coverage.json
          git commit -m "chore(uigs): refresh baseline-aware UI index"
          bash tools/push_with_rebase_retry.sh main 5
