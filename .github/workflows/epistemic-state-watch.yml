name: Epistemic State Watch

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate epistemic graph
        run: python tools/evaluate_epistemic_graph.py --check

      - name: Generate epistemic state and validation missions
        run: |
          python tools/evaluate_epistemic_graph.py
          python tools/generate_validation_missions.py

      - name: Upload epistemic reports
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-state
          path: |
            reports/generated/epistemic-state.json
            reports/generated/epistemic-state.md
            reports/generated/validation-missions.json
            reports/generated/validation-missions.md
          retention-days: 30

      - name: Fail visibly on effective quarantine
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("reports/generated/epistemic-state.json").read_text(encoding="utf-8"))
          quarantined=[
              c["id"] for c in report.get("claims",[])
              if c.get("effective_authority")=="quarantined"
          ]
          if quarantined:
              print("Effective authority quarantine requires review:")
              for cid in quarantined:
                  print(f"- {cid}")
              raise SystemExit(1)
          print("No effectively quarantined claims.")
          PY
