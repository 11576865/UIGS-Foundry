name: Validate Foundry

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test intake collector
        run: python tools/test_collect_outboxes.py
      - name: Unit-test pending triage
        run: python tools/test_triage_pending.py
      - name: Unit-test project-state reporting\n        run: python tools/test_project_state_report.py\n      - name: Validate registry and manifests\n        run: python tools/validate_foundry.py
      - name: Generate inventory report
        run: python tools/generate_reports.py
      - name: Generate Red Reason report
        run: python tools/generate_red_reason_report.py
