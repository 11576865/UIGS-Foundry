name: Capture Production UI Web
# source checkout intentionally follows current MKV main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-production-ui-web.yml'
      - 'tools/register_visual_evidence.py'
      - 'tools/build_visual_evidence_index.py'
      - 'schemas/ui-production-visual-evidence.schema.json'
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uigs-production-ui-capture-writer
  cancel-in-progress: false

jobs:
  mkv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 11576865/MKV-Fast-Muxer
          path: .capture/mkv
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install product and browser
        working-directory: .capture/mkv
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start real product UI
        working-directory: .capture/mkv
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/mkv-vite.log" 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mkv-vite.log"
          exit 1
      - name: Capture all declared MKV production states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p domains/interface-grammar/visual-evidence/images/MKV
          SHA="$(git -C .capture/mkv rev-parse HEAD)"
          mapfile -t IDS < <(python -c 'import json; print("\n".join(x["id"] for x in json.load(open(".capture/mkv/.uigs/ui-visual-capture.json",encoding="utf-8"))["captures"]))')
          for ID in "${IDS[@]}"; do
            OUT="domains/interface-grammar/visual-evidence/images/MKV/${ID}.png"
            META="$RUNNER_TEMP/${ID}.json"
            node .capture/mkv/.uigs/capture-ui.mjs --capture "$ID" --base-url http://127.0.0.1:4173 --output "$OUT" --metadata-output "$META"
            python tools/register_visual_evidence.py --contract .capture/mkv/.uigs/ui-visual-capture.json --capture-id "$ID" --source-repository 11576865/MKV-Fast-Muxer --source-revision "$SHA" --image "$OUT" --metadata "$META" --output-manifest "domains/interface-grammar/visual-evidence/manifests/VISUAL.PRODUCTION.${ID}.json"
          done
      - name: Persist MKV source evidence first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "uigs-foundry-bot"
          git config user.email "uigs-foundry-bot@users.noreply.github.com"
          SOURCE_PATHS=(domains/interface-grammar/visual-evidence/images/MKV)
          mapfile -t MANIFESTS < <(find domains/interface-grammar/visual-evidence/manifests -maxdepth 1 -type f -name 'VISUAL.PRODUCTION.MKV.*.json' -print)
          SOURCE_PATHS+=("${MANIFESTS[@]}")
          if [[ -n "$(git status --porcelain -- "${SOURCE_PATHS[@]}")" ]]; then
            git add -A "${SOURCE_PATHS[@]}"
            git commit -m "chore(uigs): capture MKV production UI evidence"
            bash tools/push_with_rebase_retry.sh main 5
          else
            git fetch origin main
            git rebase origin/main
          fi
      - name: Rebuild visual evidence indexes from latest source state
        run: |
          python tools/build_visual_evidence_index.py
          python tools/generate_ui_knowledge_report.py
          python tools/test_register_visual_evidence.py
          python tools/test_ui_evidence_resolver.py
      - name: Persist derived visual indexes
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_PATHS=(domains/interface-grammar/visual-evidence/index.json domains/interface-grammar/visual-evidence/coverage.json reports/generated/ui-knowledge-coverage.json reports/generated/ui-knowledge-coverage.md)
          if [[ -z "$(git status --porcelain -- "${DERIVED_PATHS[@]}")" ]]; then exit 0; fi
          git config user.name "uigs-foundry-bot"
          git config user.email "uigs-foundry-bot@users.noreply.github.com"
          git add -A "${DERIVED_PATHS[@]}"
          git commit -m "chore(uigs): refresh MKV visual evidence index"
          bash tools/push_with_rebase_retry.sh main 5
