name: Capture Production UI Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-production-ui-web.yml'
      - 'tools/register_visual_evidence.py'
      - 'tools/build_visual_evidence_index.py'
      - 'schemas/ui-production-visual-evidence.schema.json'
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uigs-production-ui-capture-writer
  cancel-in-progress: false

jobs:
  mkv-output-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 11576865/MKV-Fast-Muxer
          path: .capture/mkv
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install product and browser
        working-directory: .capture/mkv
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start real product UI
        working-directory: .capture/mkv
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/mkv-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mkv-vite.pid"
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mkv-vite.log"
          exit 1
      - name: Capture declared MKV production state
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/domains/interface-grammar/visual-evidence/images/MKV/MKV.OUTPUT_HUB.DESKTOP_DARK.png"
          META="$RUNNER_TEMP/mkv-capture.json"
          mkdir -p "$(dirname "$OUT")"
          node .capture/mkv/.uigs/capture-ui.mjs \
            --capture MKV.OUTPUT_HUB.DESKTOP_DARK \
            --base-url http://127.0.0.1:4173 \
            --output "$OUT" \
            --metadata-output "$META"
          SHA="$(git -C .capture/mkv rev-parse HEAD)"
          python tools/register_visual_evidence.py \
            --contract .capture/mkv/.uigs/ui-visual-capture.json \
            --capture-id MKV.OUTPUT_HUB.DESKTOP_DARK \
            --source-repository 11576865/MKV-Fast-Muxer \
            --source-revision "$SHA" \
            --image "$OUT" \
            --metadata "$META" \
            --output-manifest domains/interface-grammar/visual-evidence/manifests/VISUAL.PRODUCTION.MKV.OUTPUT_HUB.DESKTOP_DARK.json
      - name: Persist source visual evidence first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "uigs-foundry-bot"
          git config user.email "uigs-foundry-bot@users.noreply.github.com"
          SOURCE_PATHS=(
            domains/interface-grammar/visual-evidence/images/MKV/MKV.OUTPUT_HUB.DESKTOP_DARK.png
            domains/interface-grammar/visual-evidence/manifests/VISUAL.PRODUCTION.MKV.OUTPUT_HUB.DESKTOP_DARK.json
          )
          if [[ -n "$(git status --porcelain -- "${SOURCE_PATHS[@]}")" ]]; then
            git add -A "${SOURCE_PATHS[@]}"
            git commit -m "chore(uigs): capture MKV production UI evidence"
            bash tools/push_with_rebase_retry.sh main 5
          else
            git fetch origin main
            git rebase origin/main
          fi
      - name: Rebuild visual evidence indexes from latest source state
        run: |
          python tools/build_visual_evidence_index.py
          python tools/generate_ui_knowledge_report.py
          python tools/test_register_visual_evidence.py
          python tools/test_ui_evidence_resolver.py
      - name: Persist derived visual indexes
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_PATHS=(
            domains/interface-grammar/visual-evidence/index.json
            domains/interface-grammar/visual-evidence/coverage.json
            reports/generated/ui-knowledge-coverage.json
            reports/generated/ui-knowledge-coverage.md
          )
          if [[ -z "$(git status --porcelain -- "${DERIVED_PATHS[@]}")" ]]; then
            echo "Derived Web visual indexes unchanged."
            exit 0
          fi
          git config user.name "uigs-foundry-bot"
          git config user.email "uigs-foundry-bot@users.noreply.github.com"
          git add -A "${DERIVED_PATHS[@]}"
          git commit -m "chore(uigs): refresh production visual evidence index"
          bash tools/push_with_rebase_retry.sh main 5
